<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تم استلام طلبك | سُكون</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;1,400&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#070b12; --gold:#e2c08a; --cream:#f4eee4; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: Tajawal, sans-serif;
      background: var(--cream);
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(520px, 100%);
      background: #fff;
      border-radius: 28px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 24px 70px rgba(7,11,18,.08);
    }
    .mark {
      width: 56px; height: 56px; border-radius: 50%;
      margin: 0 auto 18px;
      background: radial-gradient(circle at 30% 30%, #fff, var(--gold));
      display: grid; place-items: center; font-weight: 900; font-size: 22px;
    }
    h1 { font-size: 28px; font-weight: 900; line-height: 1.3; margin-bottom: 12px; }
    p { color: #5c564c; line-height: 1.8; }
    .steps { text-align: right; margin: 28px 0; display: grid; gap: 12px; }
    .steps div {
      background: #f7f3ea; border-radius: 16px; padding: 14px 16px;
    }
    .steps b { color: #b8893e; }
    .wait {
      font-family: Amiri, serif; font-size: 20px; color: #b8893e;
      margin: 8px 0 22px;
    }
    a {
      display: inline-block; background: var(--gold); color: var(--ink);
      font-weight: 800; border-radius: 999px; padding: 12px 22px; text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">س</div>
    <h1>تم استلام طلبك</h1>
    <p class="wait" id="hi">سُكون</p>
    <p>ما تحتاج تسوي شيء الحين. فريقنا بيتصل على رقمك لتأكيد الطلب، والدفعة عند الاستلام.</p>
    <div class="steps">
      <div><b>1.</b> خلّ الجوال قريب — بنت من الفريق بتتصل.</div>
      <div><b>2.</b> تأكد العنوان والباقة على الهاتف.</div>
      <div><b>3.</b> ادفع عند ما يوصلك الطلب داخل السعودية.</div>
    </div>
    <p style="font-size:13px;margin-bottom:22px">بدون تحويل واتساب. الطلب وصلنا مباشرة.</p>
    <a href="./index.html">العودة للرئيسية</a>
  </div>
  <script>
    var q = new URLSearchParams(location.search).get("name");
    if (q) document.getElementById("hi").textContent = "الله يعافيك يا " + q;
  </script>
</body>
</html>
