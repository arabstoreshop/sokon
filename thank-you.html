<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تم استلام طلبك | سُكون</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;1,400&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#070b12; --gold:#e2c08a; --cream:#f4eee4; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: Tajawal, sans-serif;
      background: var(--cream);
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(520px, 100%);
      background: #fff;
      border-radius: 28px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 24px 70px rgba(7,11,18,.08);
    }
    .mark {
      width: 56px; height: 56px; border-radius: 50%;
      margin: 0 auto 18px;
      background: #070b12;
      display: grid; place-items: center;
    }
    .mark svg { width: 40px; height: 40px; display: block; }
    h1 { font-size: 28px; font-weight: 900; line-height: 1.3; margin-bottom: 12px; }
    p { color: #5c564c; line-height: 1.8; }
    .steps { text-align: right; margin: 28px 0; display: grid; gap: 12px; }
    .steps div {
      background: #f7f3ea; border-radius: 16px; padding: 14px 16px;
    }
    .steps b { color: #b8893e; }
    .wait {
      font-family: Amiri, serif; font-size: 20px; color: #b8893e;
      margin: 8px 0 22px;
    }
    a {
      display: inline-block; background: var(--gold); color: var(--ink);
      font-weight: 800; border-radius: 999px; padding: 12px 22px; text-decoration: none;
    }
  </style>
  <script>
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq("init", "1102428529130490");
    fbq("track", "PageView");
  </script>
  <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1102428529130490&ev=PageView&noscript=1" alt="" /></noscript>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="23" stroke="#e2c08a" stroke-width="2.15" stroke-linecap="round" stroke-dasharray="122 22" transform="rotate(-90 32 32)"/><path fill="#e2c08a" d="M36.2 19.8c7.4 2.2 12.4 9.2 12.4 17.2 0 10-8.1 18.1-18.1 18.1-4.4 0-8.4-1.6-11.5-4.2 3.8 3.6 9 5.8 14.6 5.8 11.2 0 20.3-9.1 20.3-20.3 0-8.4-5.1-15.6-12.4-18.6-.8 0-3.4.4-5.3 2z"/><circle cx="46.2" cy="17.8" r="2.15" fill="#f4eee4"/></svg>
    </div>
    <h1>تم استلام طلبك</h1>
    <p class="wait" id="hi">سُكون</p>
    <p>ما تحتاج تسوي شيء الحين. فريقنا بيتصل على رقمك لتأكيد الطلب، والدفعة عند الاستلام.</p>
    <div class="steps">
      <div><b>1.</b> خلّ الجوال قريب — بنت من الفريق بتتصل.</div>
      <div><b>2.</b> تأكد العنوان والباقة على الهاتف.</div>
      <div><b>3.</b> ادفع عند ما يوصلك الطلب داخل السعودية.</div>
    </div>
    <p style="font-size:13px;margin-bottom:22px">بدون تحويل واتساب. الطلب وصلنا مباشرة.</p>
    <a href="./index.html">العودة للرئيسية</a>
  </div>
  <script>
    var params = new URLSearchParams(location.search);
    var name = params.get("name");
    if (name) document.getElementById("hi").textContent = "الله يعافيك يا " + name;
    var value = parseFloat(params.get("value") || "0");
    var contentName = params.get("content_name") || "سُكون";
    var contentIds = params.get("content_ids") || "2";
    if (value > 0) {
      var firedKey = "sk_purchase_" + value + "_" + contentIds;
      if (!sessionStorage.getItem(firedKey)) {
        sessionStorage.setItem(firedKey, "1");
        fbq("track", "Purchase", {
          value: value,
          currency: "SAR",
          content_name: contentName,
          content_ids: [contentIds],
          content_type: "product"
        });
      }
    }
  </script>
</body>
</html>
